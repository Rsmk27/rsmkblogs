<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RSMK Engineering Technology Portal — Detailed technical specification, working principles, applications, and code examples.">
    <title>Technology Documentation Portal | RSMK Blogs</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "xuzwk3xt97");
    </script>
</head>

<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/logo.png" alt="RSMK Logo">RSMK<span>.</span>
            </a>
            
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="blogs.html">Articles</a>
                <a href="topics.html" class="active">Topics</a>
                <a href="companies.html">Companies</a>
                <a href="roadmaps.html">Roadmaps</a>
                <a href="projects.html">Projects</a>
                <a href="resources.html">Resources</a>
                <a href="about.html">About</a>
            </nav>

            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="search-trigger-btn" aria-label="Open Global Search">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
                    <span>Search documentation...</span>
                    <kbd>Ctrl K</kbd>
                </button>
                <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Dark Mode">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main id="main-content" class="section-padding">
        <div class="container" id="tech-portal-container">
            <!-- Dynamic Content Injected via Script -->
        </div>
    </main>

    <footer>
        <div class="container">
                                    <div class="footer-bottom">
                <div>© 2026 RSMK Blogs. Engineered & Maintained by <a href="https://rsmk.me" target="_blank" rel="noopener" style="color: var(--primary-color); font-weight: 600;">Srinivasa Manikanta (RSMK)</a>.</div>
                <div style="display: flex; gap: 16px;">
                    <a href="https://rsmk.me" target="_blank" rel="noopener">Portfolio (rsmk.me)</a>
                    <a href="https://github.com/Rsmk27" target="_blank" rel="noopener">GitHub</a>
                    <a href="https://www.linkedin.com/in/srinivasamanikanta/" target="_blank" rel="noopener">LinkedIn</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/search-index.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const techId = (params.get("id") || "esp32").toLowerCase().trim();
            const dataStore = window.KNOWLEDGE_BASE || { terms: {} };
            const tech = dataStore.terms[techId] || dataStore.terms["esp32"];

            const container = document.getElementById("tech-portal-container");
            container.innerHTML = `
                <div style="margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border-color);">
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                        <span class="badge badge-beginner">${tech.category}</span>
                        <span style="font-size:0.85rem; color:var(--text-subtle);">Primary Vendor: ${tech.company || 'Industry Standard'}</span>
                    </div>
                    <h1 style="font-size: 2.8rem; margin-bottom: 16px;">${tech.name}</h1>
                    <p style="font-size: 1.15rem; color: var(--text-muted); max-width: 820px; line-height: 1.6;">
                        ${tech.shortDesc}
                    </p>
                </div>

                <div class="grid-3" style="grid-template-columns: 2fr 1fr; gap: 40px;">
                    <div>
                        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Key Architectural Features</h2>
                        <ul style="margin-bottom: 32px; display:flex; flex-direction:column; gap:10px;">
                            ${(tech.keyFeatures || []).map(f => `<li style="display:flex; align-items:center; gap:10px; font-size:0.95rem; color:var(--text-main);"><span style="color:var(--primary-color);">✓</span> ${f}</li>`).join('')}
                        </ul>

                        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Primary Applications & Industries</h2>
                        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:32px;">
                            ${(tech.applications || []).map(app => `<span class="tech-pill" style="font-size:0.875rem; padding:6px 14px;">${app}</span>`).join('')}
                        </div>

                        <div class="callout callout-info" style="margin-bottom: 32px;">
                            <div class="callout-icon">💡</div>
                            <div>
                                <div class="callout-title">Documentation Tip</div>
                                <div class="callout-content">
                                    When implementing ${tech.name} in mission-critical hardware, refer to the official datasheet and register specifications linked in the <a href="resources.html" style="color:var(--primary-color);">Resource Center</a>.
                                </div>
                            </div>
                        </div>

                        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Related Articles & Guides</h2>
                        <div class="grid-2">
                            ${(tech.relatedArticles || []).map(art => `
                                <div class="entity-card">
                                    <h4 style="margin-bottom:8px;"><a href="${art.url}">${art.title}</a></h4>
                                    <a href="${art.url}" style="font-size:0.8rem; color:var(--primary-color); font-weight:600;">Read Full Documentation →</a>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <div style="background:var(--surface-color); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:24px;">
                            <h3 style="font-size:1.1rem; margin-bottom:16px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">Quick Metadata</h3>
                            
                            <div style="margin-bottom:14px;">
                                <div class="meta-item-label">Category</div>
                                <div class="meta-item-value">${tech.category}</div>
                            </div>

                            <div style="margin-bottom:14px;">
                                <div class="meta-item-label">Associated Vendor</div>
                                <div class="meta-item-value">${tech.company}</div>
                            </div>

                            <div style="margin-bottom:20px;">
                                <div class="meta-item-label">Status</div>
                                <div class="meta-item-value" style="color:var(--color-success);">Production Ready</div>
                            </div>

                            <a href="roadmaps.html" class="btn btn-primary" style="width:100%;">View Learning Roadmap</a>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>

</html>
