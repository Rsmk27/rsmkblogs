    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const projId = (params.get("id") || "smart-home-hub").toLowerCase().trim();
            const dataStore = window.KNOWLEDGE_BASE || { projects: [] };
            const proj = dataStore.projects.find(p => p.id === projId) || dataStore.projects[0];

            const container = document.getElementById("project-detail-container");
            container.innerHTML = `
                <div style="margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border-color);">
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                        <span class="badge badge-intermediate">${proj.difficulty}</span>
                        <span class="tech-pill">${proj.category}</span>
                    </div>
                    <h1 style="font-size: 2.5rem; margin-bottom: 16px;">${proj.title}</h1>
                    <p style="font-size: 1.1rem; color: var(--text-muted); max-width: 820px; line-height: 1.6;">
                        ${proj.desc}
                    </p>
                </div>

                <div class="grid-3" style="grid-template-columns: 2fr 1fr; gap: 40px;">
                    <div>
                        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Hardware Bill of Materials (BOM)</h2>
                        <div style="background:var(--surface-color); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:20px; margin-bottom:32px;">
                            <ul style="display:flex; flex-direction:column; gap:10px;">
                                ${(proj.hardware || []).map(hw => `<li style="font-size:0.95rem; color:var(--text-main); display:flex; align-items:center; gap:8px;"><span style="color:var(--primary-color);">■</span> ${hw}</li>`).join('')}
                            </ul>
                        </div>

                        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Software & Protocol Stack</h2>
                        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:32px;">
                            ${(proj.software || []).map(sw => `<span class="tech-pill" style="font-size:0.9rem; padding:6px 14px;">${sw}</span>`).join('')}
                        </div>

                        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Source Code Implementation</h2>
                        <div class="code-block-wrapper">
                            <div class="code-header">
                                <span>main.cpp (C++ / ESP-IDF)</span>
                            </div>
                            <pre><code>#include &lt;stdio.h&gt;
#include "freertos/FreeRTOS.h"
#include "freertos/task.h"
#include "esp_wifi.h"
#include "esp_event.h"
#include "nvs_flash.h"

// Initialize RS-485 Modbus Telemetry Task
void modbus_telemetry_task(void *pvParameters) {
    while (1) {
        printf("Polling Modbus RS-485 registers...\n");
        vTaskDelay(pdMS_TO_TICKS(1000));
    }
}

extern "C" void app_main(void) {
    esp_err_t ret = nvs_flash_init();
    if (ret == ESP_ERR_NVS_NO_FREE_PAGES || ret == ESP_ERR_NVS_NEW_VERSION_FOUND) {
        ESP_ERROR_CHECK(nvs_flash_erase());
        ret = nvs_flash_init();
    }
    ESP_ERROR_CHECK(ret);

    xTaskCreate(&modbus_telemetry_task, "modbus_task", 4096, NULL, 5, NULL);
}</code></pre>
                        </div>

                        <div class="callout callout-tip" style="margin-top:32px;">
                            <div class="callout-icon">⚡</div>
                            <div>
                                <div class="callout-title">Lessons Learned</div>
                                <div class="callout-content">
                                    When driving RS-485 differential signals near high-current relays, ensure a 120-ohm termination resistor is placed across A and B lines to suppress high-frequency reflection noise.
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div style="background:var(--surface-color); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:24px;">

                            <div style="margin-bottom:14px;">

                                <div class="meta-item-value">${proj.difficulty}</div>
                            </div>

                            <div style="margin-bottom:14px;">
                                <div class="meta-item-label">Domain</div>
                                <div class="meta-item-value">${proj.category}</div>
                            </div>

                            <div style="margin-bottom:20px;">
                                <div class="meta-item-label">Related Article</div>
                                <div class="meta-item-value"><a href="${proj.articleLink}" style="color:var(--primary-color);">Read Full Article →</a></div>
                            </div>

                            <button class="btn btn-primary" style="width:100%;" onclick="alert('Download package initiated!');">Download Project Package (ZIP)</button>
                        </div>
                    </div>
